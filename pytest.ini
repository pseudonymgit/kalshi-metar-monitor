[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end pipeline
    signal: Signal evaluation tests
    agreement_gate: Agreement gate tests
    position_sizing: Position sizing tests
    trade_journal: Trade journal tests
    backtest: Backtest runner tests
    slow: Tests that may take longer to run