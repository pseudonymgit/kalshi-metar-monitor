<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trading Dashboard{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2128;
            --bg-hover: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --green: #3fb950;
            --green-bg: rgba(63, 185, 80, 0.15);
            --red: #f85149;
            --red-bg: rgba(248, 81, 73, 0.15);
            --yellow: #d29922;
            --yellow-bg: rgba(210, 153, 34, 0.15);
            --blue: #58a6ff;
            --blue-bg: rgba(88, 166, 255, 0.15);
            --purple: #bc8cff;
            --orange: #f0883e;
            --accent: #2ea043;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        .topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .topbar .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .topbar .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .topbar .status-dot.connected { background: var(--green); }
        .topbar .status-dot.disconnected { background: var(--red); }

        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            gap: 0;
            overflow-x: auto;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .nav a:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .nav a.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        .grid {
            display: grid;
            gap: 16px;
        }

        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

        @media (max-width: 1200px) {
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .container { padding: 12px; }
            .topbar { padding: 10px 12px; }
            .nav { padding: 0 12px; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .card h2 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.yellow { color: var(--yellow); }
        .stat-value.blue { color: var(--blue); }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .chart-container {
            width: 100%;
            min-height: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 8px 10px;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        tr:hover td {
            background: var(--bg-hover);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-green { background: var(--green-bg); color: var(--green); }
        .badge-red { background: var(--red-bg); color: var(--red); }
        .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
        .badge-blue { background: var(--blue-bg); color: var(--blue); }

        .loading {
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px;
            text-align: center;
        }

        .error-state {
            color: var(--red);
            font-size: 13px;
            padding: 12px;
            background: var(--red-bg);
            border-radius: 6px;
            margin: 8px 0;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .filter-bar input,
        .filter-bar select {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            outline: none;
            border-color: var(--blue);
        }

        .risk-gauge {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .risk-indicator {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .risk-indicator.ok { background: var(--green-bg); color: var(--green); border: 2px solid var(--green); }
        .risk-indicator.warning { background: var(--yellow-bg); color: var(--yellow); border: 2px solid var(--yellow); }
        .risk-indicator.kill_switch { background: var(--red-bg); color: var(--red); border: 2px solid var(--red); }

        .thermometer-container {
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
            margin: 4px 0;
        }

        .thermometer-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .thermometer-fill.safe { background: var(--green); }
        .thermometer-fill.warning { background: var(--yellow); }
        .thermometer-fill.danger { background: var(--red); }

        .alert-row {
            padding: 8px 10px;
            border-left: 3px solid transparent;
            margin-bottom: 2px;
        }

        .alert-row.green { border-left-color: var(--green); }
        .alert-row.red { border-left-color: var(--red); }
        .alert-row.yellow { border-left-color: var(--yellow); }

        .alert-row .alert-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .alert-row .alert-station {
            font-weight: 500;
        }

        .alert-row .alert-outcome {
            font-size: 11px;
        }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .text-sm { font-size: 12px; }
        .text-muted { color: var(--text-muted); }
        .w-full { width: 100%; }
        .overflow-auto { overflow: auto; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="topbar">
        <h1>🌤️ Weather Trading Dashboard</h1>
        <span class="subtitle">
            <span class="status-dot" id="connection-status"></span>
            <span id="last-update">Connecting...</span>
        </span>
    </div>

    <nav class="nav">
        <a href="/trading/" class="{% block nav_pnl %}{% endblock %}">P&L / Positions</a>
        <a href="/trading/positions" class="{% block nav_positions %}{% endblock %}">Positions</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="/trading/static/dashboard.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
